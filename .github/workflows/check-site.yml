# Runs tools/check-site.mjs on every push and pull request, then confirms the
# generated markup matches tools/sync-*.py. Both need only the runner's
# preinstalled Node and Python, so there is no setup step or package install,
# and the only third-party code is actions/checkout, pinned to a full commit
# SHA (update the SHA and the version comment together).
name: check-site

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check site invariants
        run: node tools/check-site.mjs
      # The head, header, footer, and breadcrumbs are generated; a hand edit to any of
      # them shows up here as a diff after the two scripts rewrite them.
      - name: Check generated markup is in sync
        run: |
          python3 tools/sync-furniture.py
          python3 tools/sync-heads.py
          git diff --exit-code -- '*.html'
