# Runs tools/check-site.mjs on every push and pull request. The script needs
# nothing beyond the runner's preinstalled Node, so there is no setup-node or
# npm install, and the only third-party code is actions/checkout, pinned to a
# full commit SHA (update the SHA and the version comment together).
name: check-site

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check site invariants
        run: node tools/check-site.mjs
